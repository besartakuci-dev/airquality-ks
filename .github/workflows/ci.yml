name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint + tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12.16"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r api/requirements-dev.txt
      - run: ruff check api tests
      - run: ruff format --check api tests
      - run: pytest

  dashboard:
    name: Dashboard (lint + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker images (build only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use placeholder env for compose
        run: cp .env.example .env
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build images (no push)
        run: docker compose build api dashboard
